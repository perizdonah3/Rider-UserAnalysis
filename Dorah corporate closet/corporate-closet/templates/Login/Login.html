<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="assets/img/Dorahicon8.png" rel="icon">
    <link href="assets/img/Dorahicon8.png" rel="icon">

    <title>Login-Page</title>

    <script type="module" src="assets/js/firebase-init.js"></script>

    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            background:#6D071A;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Poppins,sans-serif;
        }

        .login-container{
            width:1000px;
            max-width:95%;
            background:rgb(190, 51, 51);
            border-radius:25px;
            overflow:hidden;
            box-shadow:0 20px 50px rgba(0,0,0,.35);
        }

        .left-side img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .right-side{
            padding:50px;
        }

        .logo{
            width:70px;
            margin-bottom:15px;
        }

        .btn-login{
            background:#6D071A;
            color:white;
            border:none;
            border-radius:30px;
            padding:12px;
            width:100%;
            font-weight:bold;
        }

        .btn-login:hover{
            background:#8A1025;
            color:white;
        }

        .form-control{
            border-radius:30px;
            padding:12px;
        }

        a{
            color:#6D071A;
            text-decoration:none;
        }

        a:hover{
            color:#D4AF37;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="row g-0">

        <div class="col-lg-6 left-side">

            <img src="assets/img/cloth25.jpg" alt="Fashion">

        </div>

        <div class="col-lg-6 right-side">

            <div class="text-center">

                <img src="assets/img/icon5.png" class="logo">

                <h2 class="fw-bold">Welcome Back</h2>

                <p class="text-muted">
                    Login to continue shopping at The Corporate Closet
                </p>

            </div>

            <form id="loginForm">

                <div class="mb-3">

                    <label>Email Address</label>

                    <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email" required>

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <div class="input-group">

                        <input type="password"
                               class="form-control"
                               id="password"
                               placeholder="Enter your password">

                        <button class="btn btn-outline-secondary"
                                type="button"
                                onclick="togglePassword()">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="d-flex justify-content-between mb-4">

                    <div>

                        <input type="checkbox">

                        Remember Me

                    </div>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit" class="btn-login" id="loginButton">

                    Login

                </button>

                <div class="text-center mt-4">

                    Don't have an account?

                    <a href="register.html">

                        Create Account

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script>

    function togglePassword(){

        const password = document.getElementById("password");

        if(password.type === "password"){

            password.type = "text";

        }else{

            password.type = "password";

        }

    }

</script>

<script type="module" src="assets/js/firebase-init.js"></script>

<script>

    // Login form handler using firebase-init helpers

    document.getElementById('loginForm').addEventListener('submit', async function(e){

        e.preventDefault();

        const email = document.getElementById('loginEmail').value.trim();

        const password = document.getElementById('password').value;

        try{

            await window.loginWithEmail(email, password);

            alert('Logged in successfully');

            window.location.href = 'index.html';

        }catch(err){

            alert('Login error: ' + (err && err.message ? err.message : err));

        }

    });

</script>

</body>

</html>
