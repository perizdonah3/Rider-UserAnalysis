<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="assets/img/Dorahicon10.png" rel="icon">
    <link href="assets/img/Dorahicon10.png" rel="icon">

    <title>Payment-Page</title>

    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            background:#6D071A;
            font-family:'Poppins',sans-serif;
        }

        .payment-container{
            background:rgb(202, 79, 79);
            border-radius:20px;
            padding:40px;
            margin:50px auto;
            max-width:1100px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        .section-title{
            color:#6D071A;
            font-weight:bold;
            margin-bottom:25px;
        }

        .form-control{
            border-radius:12px;
            padding:12px;
        }

        .form-control:focus{
            border-color:#D4AF37;
            box-shadow:0 0 8px rgba(212,175,55,.4);
        }

        .order-summary{
            background:#f8f8f8;
            border-radius:15px;
            padding:25px;
        }

        .order-summary img{
            width:70px;
            height:70px;
            object-fit:cover;
            border-radius:10px;
        }

        .btn-pay{
            background:#6D071A;
            color:rgb(229, 155, 155);
            width:100%;
            padding:14px;
            border:none;
            border-radius:30px;
            font-size:18px;
            font-weight:bold;
            transition:.3s;
        }

        .btn-pay:hover{
            background:#8B1E3F;
            color:rgb(202, 134, 134);
        }

        .secure{
            color:#a72828;
            font-size:14px;
            margin-top:15px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="payment-container">

        <div class="row">

            <!-- Billing Details -->
            <div class="col-lg-7">

                <h2 class="section-title">
                    <i class="bi bi-credit-card"></i> Payment Details
                </h2>

                <form>

                    <div class="mb-3">
                        <label>Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your full name">
                    </div>

                    <div class="mb-3">
                        <label>Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label>Phone Number</label>
                        <input type="tel" class="form-control" placeholder="07XXXXXXXX">
                    </div>

                    <div class="mb-3">
                        <label>Delivery Address</label>
                        <textarea class="form-control" rows="3" placeholder="Enter your delivery address"></textarea>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Payment Method</label>
                            <select class="form-control">
                                <option>Select Payment Method</option>
                                <option>M-Pesa</option>
                                <option>Visa Card</option>
                                <option>MasterCard</option>
                                <option>PayPal</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Promo Code</label>
                            <input type="text" class="form-control" placeholder="Optional">
                        </div>

                    </div>

                    <button class="btn-pay">
                        <i class="bi bi-lock-fill"></i>
                        Complete Payment
                    </button>

                    <div class="secure">
                        <i class="bi bi-shield-check"></i>
                        Your payment is encrypted and secure.
                    </div>

                </form>

            </div>

            <!-- Order Summary -->
            <div class="col-lg-5">

                <div class="order-summary">

                    <h3 class="mb-4">Order Summary</h3>

                    <div class="d-flex mb-3">

                        <img src="assets/img/cloth1.jpg">

                        <div class="ms-3">

                            <h6>Decent Wear</h6>

                            <p class="text-muted">
                                Qty: 1
                            </p>

                            <strong>KSh 300</strong>

                        </div>

                    </div>

                    <div class="d-flex mb-3">

                        <img src="assets/img/cloth3.jpg">

                        <div class="ms-3">

                            <h6>T Shirt</h6>

                            <p class="text-muted">
                                Qty: 1
                            </p>

                            <strong>KSh 300</strong>

                        </div>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">
                        <span>Subtotal</span>
                        <strong>KSh 600</strong>
                    </div>

                    <div class="d-flex justify-content-between">
                        <span>Delivery</span>
                        <strong>KSh 200</strong>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between fs-4">
                        <strong>Total</strong>
                        <strong style="color:#6D071A;">
                            KSh 800
                        </strong>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
